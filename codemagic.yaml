
workflows:
  android-workflow:
    name: Android APK
    instance_type: linux_x1
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Unzip dan Build
        script: |
          unzip -o "KITSUNE V2.zip" -d app
          find app -name "*.zip" -exec sh -c 'unzip -o "$1" -d "$(dirname "$1")"' _ {} \;
          APP_DIR=$(find app -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Ketemu di: $APP_DIR"
          cd "$APP_DIR"
          flutter pub get
          flutter build apk --release
          find . -name "app-release.apk"
    artifacts:
      - app/**/build/app/outputs/flutter-apk/app-release.apk
      - app/**/app-release.apk
    publishing:
      email:
        recipients:
          - winkfresh1237-a11y@gmail.com
