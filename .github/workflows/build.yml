name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o 'KITSUNE V2.zip' -d extracted
          # Cari pubspec.yaml utama doang, max 3 level, skip vendor/third_party/example
          FOUND=$(find extracted -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          PROJECT_DIR="${FOUND%/*}"
          echo "Found project at $PROJECT_DIR"
          ls "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: KITSUNE-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
