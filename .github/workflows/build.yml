name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o 'KITSUNE V2.zip' -d extracted
          FOUND=$(find extracted -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          PROJECT_DIR="${FOUND%/*}"
          echo "Found project at $PROJECT_DIR"
          ls "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix Gradle Download - Pakai Mirror + Retry
        run: |
          cd "$PROJECT_DIR"
          # Ganti URL Gradle ke mirror Tencent yang lebih stabil
          WRAPPER_FILE=$(find . -name "gradle-wrapper.properties" | head -n 1)
          echo "Wrapper: $WRAPPER_FILE"
          cat "$WRAPPER_FILE"
          sed -i 's|https://services.gradle.org/distributions/|https://mirrors.cloud.tencent.com/gradle/|' "$WRAPPER_FILE"
          cat "$WRAPPER_FILE"
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: KITSUNE-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
