name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Unzip dan Build
        run: |
          unzip -o "KITSUNE V2.zip" -d app
          cd app
          # kalo di dalem zip masih ada folder lagi, masuk ke dalemnya
          if [ -f "pubspec.yaml" ]; then echo "ketemu di sini"; else cd $(ls -d */ | head -n 1); fi
          pwd
          ls
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KITSUNE-APK
          path: "**/app-release.apk"
