
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Unzip dan Build
        run: |
          unzip -o "KITSUNE V2.zip" -d app
          # kalo di dalemnya masih ada zip lagi, unzip juga
          find app -name "*.zip" -exec sh -c 'unzip -o "$1" -d "$(dirname "$1")"' _ {} \;
          APP_DIR=$(find app -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Ketemu di: $APP_DIR"
          ls "$APP_DIR"
          cd "$APP_DIR"
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KITSUNE-APK
          path: "**/app-release.apk"